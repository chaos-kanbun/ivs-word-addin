<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>異体字セレクタ</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <main>
    <section class="tools">
      <div class="btnrow">
        <button id="toOld" class="secondary" type="button">旧字体へ</button>
        <button id="toNew" class="secondary" type="button">新字体へ</button>
        <button id="strip" class="secondary" type="button">IVS除去</button>
      </div>
      <div id="kyushinPanel" hidden>
        <div class="row">
          <span class="muted">変換先が複数ある字:選ぶとその字だけ変換</span>
          <button id="kyushinCancel" class="link" type="button">閉じる</button>
        </div>
        <div id="kyushinChoices"></div>
      </div>
    </section>
    <section class="top">
      <div class="row">
        <h2>対象の文字</h2>
        <span id="current" class="muted"></span>
      </div>
      <div id="chips" class="chips" aria-label="対象文字の選択"></div>
    </section>

    <section class="mid">
      <div class="row">
        <label class="check">
          <input id="mjOnly" type="checkbox" checked />
          <span>Moji_Joho のみ</span>
        </label>
        <select id="collection" aria-label="コレクションで絞り込み"></select>
      </div>
      <div id="cards" class="cards"></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="taskpane.js"></script>
</body>
</html>
